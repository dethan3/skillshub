name: Skill Submission
on:
  issues:
    types:
      - labeled

jobs:
  Process-Skill-Submission:
    if: github.event.label.name == 'skill-submission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: issue-parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: ".github/ISSUE_TEMPLATE/submit-skill.yml"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Import skill from repository
        id: import
        run: |
          REPO_URL="${{ steps.issue-parser.outputs.issueparser_repo_url }}"
          echo "Importing skill from: $REPO_URL"
          
          # Run import script and capture output
          if pnpm run import-skill "$REPO_URL" 2>&1 | tee import-output.txt; then
            echo "import_success=true" >> $GITHUB_OUTPUT
            # Extract skill name from output
            SKILL_NAME=$(grep "Name:" import-output.txt | head -1 | sed 's/.*Name: //')
            echo "skill_name=$SKILL_NAME" >> $GITHUB_OUTPUT
          else
            echo "import_success=false" >> $GITHUB_OUTPUT
            echo "Auto-import failed, creating manual review PR"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "[skill] Add ${{ steps.import.outputs.skill_name || steps.issue-parser.outputs.issueparser_skill_name }}"
          body: |
            ## New Skill Submission
            
            **Name:** ${{ steps.import.outputs.skill_name || steps.issue-parser.outputs.issueparser_skill_name }}
            **Repository:** ${{ steps.issue-parser.outputs.issueparser_repo_url }}
            **Category:** ${{ steps.issue-parser.outputs.issueparser_category }}
            **Description:** ${{ steps.issue-parser.outputs.issueparser_description }}
            
            ### Import Status
            ${{ steps.import.outputs.import_success == 'true' && '✅ Skill automatically imported from repository' || '⚠️ Manual import required - please review and update skills.ts' }}
            
            ---
            Closes #${{ github.event.issue.number }}
          branch: skill-submission-${{ github.event.issue.number }}
          commit-message: "Add skill: ${{ steps.import.outputs.skill_name || steps.issue-parser.outputs.issueparser_skill_name }}"
