name: Sync Skills
on:
  schedule:
    - cron: "0 12 * * 1" # Every Monday at 12:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Sync skills from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync-skills

      - name: Generate sitemap
        run: pnpm generate-sitemap

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "[sync] Update skills from GitHub"
          body: |
            ## Automated Skills Sync

            This PR was automatically generated by the weekly skills sync workflow.

            ### Changes
            - Updated `src/data/skills.ts` with latest skills from GitHub
            - Updated `public/sitemap.xml` with new skill pages

            ---
            🤖 Generated by [sync-skills.yml](.github/workflows/sync-skills.yml)
          branch: sync-skills
          commit-message: "chore: sync skills from GitHub"
